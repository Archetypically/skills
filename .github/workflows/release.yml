---
name: Release skills

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag for the release (e.g. v1.0.0). It must not exist yet."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Check the GitHub CLI supports gh skill
        run: |
          gh --version
          gh skill publish --help > /dev/null

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh skill publish --tag "${{ inputs.tag }}"
